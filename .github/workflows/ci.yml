name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SentinelPay.slnx

      - name: Build
        run: dotnet build SentinelPay.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test SentinelPay.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Build production container
        run: docker build --tag sentinelpay:${{ github.sha }} .

      - name: Build provider simulator container
        run: >-
          docker build
          --file Dockerfile.provider-simulator
          --tag sentinelpay-provider-simulator:${{ github.sha }}
          .
