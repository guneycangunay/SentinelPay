name: sentinelpay

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sentinelpay;Username=sentinelpay;Password=${SENTINELPAY_DB_PASSWORD:?required}"
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__RabbitMq: "amqp://sentinelpay:${SENTINELPAY_RABBITMQ_PASSWORD:?required}@rabbitmq:5672/"
      Database__InitializeOnStartup: "true"
      DevelopmentMerchant__Seed: "true"
      DevelopmentMerchant__ApiKey: "${SENTINELPAY_API_KEY:?required}"
      Redis__Enabled: "true"
      Outbox__DispatcherEnabled: "true"
      Messaging__Provider: RabbitMq
      Webhooks__mock-bank__Secret: "${SENTINELPAY_MOCK_BANK_WEBHOOK_SECRET:?required}"
      Webhooks__sandbox-wallet__Secret: "${SENTINELPAY_SANDBOX_WALLET_WEBHOOK_SECRET:?required}"
      Webhooks__acquirer-http__Secret: "${SENTINELPAY_ACQUIRER_WEBHOOK_SECRET:?required}"
      Providers__AcquirerHttp__BaseUrl: http://provider-simulator:8080
      Messaging__ConsumerEnabled: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      provider-simulator:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  provider-simulator:
    build:
      context: .
      dockerfile: Dockerfile.provider-simulator
    ports:
      - "8090:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loadtest:
    image: grafana/k6:1.0.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://api:8080
      API_KEY: "${SENTINELPAY_API_KEY:?required}"
    volumes:
      - ./load-tests:/scripts:ro
    command: ["run", "/scripts/payment-lifecycle.js"]
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sentinelpay
      POSTGRES_USER: sentinelpay
      POSTGRES_PASSWORD: "${SENTINELPAY_DB_PASSWORD:?required}"
    ports:
      - "5432:5432"
    volumes:
      - sentinelpay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelpay -d sentinelpay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sentinelpay-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sentinelpay
      RABBITMQ_DEFAULT_PASS: "${SENTINELPAY_RABBITMQ_PASSWORD:?required}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - sentinelpay-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  sentinelpay-postgres:
  sentinelpay-redis:
  sentinelpay-rabbitmq:
