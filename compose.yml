name: sentinelpay

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=sentinelpay;Username=sentinelpay;Password=${SENTINELPAY_DB_PASSWORD:?required}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Database__InitializeOnStartup: "true"
      Redis__Enabled: "true"
      Outbox__DispatcherEnabled: "true"
      Webhooks__mock-bank__Secret: ${SENTINELPAY_MOCK_BANK_WEBHOOK_SECRET:?required}
      Webhooks__sandbox-wallet__Secret: ${SENTINELPAY_SANDBOX_WALLET_WEBHOOK_SECRET:?required}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sentinelpay
      POSTGRES_USER: sentinelpay
      POSTGRES_PASSWORD: ${SENTINELPAY_DB_PASSWORD:?required}
    ports:
      - "5432:5432"
    volumes:
      - sentinelpay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelpay -d sentinelpay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sentinelpay-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sentinelpay-postgres:
  sentinelpay-redis:
